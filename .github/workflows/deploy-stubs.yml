name: Deploy WireMock Stub

on:
  push:
    branches: [ main ]
    paths:
      - 'stubs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy stub to WireMock
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data @stubs/my-stub.json \
            http://4.255.29.130/__admin/mappings
