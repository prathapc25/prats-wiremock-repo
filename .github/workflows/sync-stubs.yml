name: Sync WireMock Stubs to AKS
on:
push:
paths:
  - 'wiremock/mappings/**'
branches:
  - main

jobs:
deploy-stubs:
runs-on: ubuntu-latest
steps:
- name: Checkout Source Code
  uses: actions/checkout@v4

- name: Login to Azure
  uses: azure/login@v2
  with:
    creds: ${{ secrets.AZURE_CREDENTIALS }}

- name: Push Mappings to Azure File Share
  uses: azure/CLI@v2
  with:
    azcliversion: latest
    inlineScript: |
      az storage file upload-batch \
        --source wiremock/mappings \
        --destination ${{ secrets.AZURE_FILE_SHARE }}/mappings \
        --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
        --overwrite true

- name: Clear Memory Cache via Admin API
  run: |
    curl -X POST "${{ secrets.WIREMOCK_URL }}/__admin/mappings/reset" \
         -H "Content-Type: application/json" \
         --fail || exit 1
